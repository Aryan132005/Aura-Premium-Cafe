services:
  # -------------------------------------------------------------
  # Backend API Web Service (Node.js / Express)
  # -------------------------------------------------------------
  - type: web
    name: aura-premium-cafe-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: aura-premium-cafe-frontend
          property: url
      # Optional: Add MySQL Credentials if using remote MySQL DB (otherwise defaults to SQLite)
      # - key: MYSQL_HOST
      #   sync: false
      # - key: MYSQL_USER
      #   sync: false
      # - key: MYSQL_PASSWORD
      #   sync: false
      # - key: MYSQL_DATABASE
      #   sync: false

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: aura-premium-cafe-frontend
    runtime: static
    plan: free
    region: singapore
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aura-premium-cafe-backend
          property: url
